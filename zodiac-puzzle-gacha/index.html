<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>12간지 퍼즐 가챠</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>12간지 퍼즐 가챠</h1>
    <div class="coin-display">🪙 <span id="coin-amount">0</span></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="puzzle">퍼즐</button>
    <button class="tab-btn" data-tab="shop">상점</button>
    <button class="tab-btn" data-tab="collection">컬렉션</button>
  </nav>

  <main>
    <section id="tab-puzzle" class="tab-panel active">
      <div class="puzzle-header">
        <div>스테이지 <span id="puzzle-stage">1</span></div>
        <div>남은 시간 <span id="puzzle-timer">--</span>초</div>
        <button id="puzzle-start-btn">시작</button>
      </div>
      <div id="puzzle-board" class="puzzle-board"></div>
      <div id="puzzle-message" class="puzzle-message"></div>
    </section>

    <section id="tab-shop" class="tab-panel">
      <div class="shop-section">
        <h2>가챠 뽑기</h2>
        <p>비용: <span id="gacha-cost"></span> 코인 · 12간지 중 무작위 1개 (중복 가능, 보상 없음)</p>
        <button id="gacha-btn">뽑기</button>
        <div id="gacha-result" class="gacha-result"></div>
      </div>
      <div class="shop-section">
        <h2>직접 구매</h2>
        <p>원하는 동물을 확정적으로 구매합니다 (개당 <span id="purchase-cost"></span> 코인)</p>
        <div id="purchase-grid" class="animal-grid"></div>
      </div>
    </section>

    <section id="tab-collection" class="tab-panel">
      <h2>컬렉션 <span id="collection-progress"></span></h2>
      <div id="collection-grid" class="animal-grid"></div>
    </section>
  </main>

  <div id="win-overlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>🎉 게임 클리어! 🎉</h2>
      <p>12간지 동물 구매권을 모두 모았습니다!</p>
      <button id="reset-btn">다시 시작</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
